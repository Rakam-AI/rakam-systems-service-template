base_url: http://localhost:8000/api

components:
  DataProcessor:
    functions:
      process_from_directory: external/process_from_directory/
      process_from_file: external/process_from_file/
  
  VectorStore:
    functions:
      search: external/vector_store/search/
      get_nodes: internal/vector_store/get_nodes/

  VSManager:
    functions:
      build_from_directory: external/vs_manager/build_from_directory/  # corrected "directroy" to "directory"
      build_from_file: external/vs_manager/build_from_file/
      add_from_directory: external/vs_manager/add_from_directory/
      add_from_file: external/vs_manager/add_from_file/
    required_components:
      - DataProcessor
  
  Generator:
    functions:
      simple_generate: external/simple_generate/
  
  RAGGenerator:
    functions:
      rag: external/rag_generate/
      split_query: internal/split_query/
      rag_generate_split_query: external/rag_generate_splitQuery/
    required_components:
      - VectorStore
